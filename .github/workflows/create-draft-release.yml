name: Create Draft Release

on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PREPARE_RELEASE_VERSION_FILE: src/plugins/version.json
      PREPARE_RELEASE_RELEASE_NOTES_FILE: release-notes.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - name: Extract release details
        id: release-details
        run: |
          set -euo pipefail
          version="$(uv run scripts/prepare_release.py current-version)"
          uv run scripts/prepare_release.py release-notes > draft-release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ steps.release-details.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file draft-release-notes.md \
            --target "$MERGE_SHA"
